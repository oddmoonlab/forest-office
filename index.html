<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>숲속 공유 오피스</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* layout: 화면 전체가 3D 방, 그 위에 따뜻한 갈색 유리 패널(장소 카드·채팅·하단 버튼줄) */
:root{
  --glass:rgba(36,24,17,.84); --glass2:rgba(44,30,21,.96); --line:rgba(255,226,190,.16);
  --cream:#f6ead6; --muted:#c9b499; --a1:#f4ab5f; --a2:#d9772f; --warn:#ee7b6b; --ok:#a8d98f;
  --display:'Jua','Gowun Dodum','Malgun Gothic',sans-serif; --body:'Gowun Dodum','Malgun Gothic',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#1a120c;color:var(--cream);font:15px/1.5 var(--body)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 32px #0007}
.btn{font-family:var(--display);border:0;border-radius:12px;padding:9px 16px;cursor:pointer;background:linear-gradient(180deg,var(--a1),var(--a2));color:#2a1608;font-size:15px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:rgba(255,226,190,.07);color:var(--cream);border:1px solid var(--line)}
.btn.small{padding:5px 12px;font-size:14px}
.btn.ghost[aria-pressed=true]{background:linear-gradient(180deg,var(--a1),var(--a2));color:#2a1608;border-color:transparent}
input,textarea,select{background:rgba(18,12,8,.7);border:1px solid var(--line);border-radius:12px;padding:9px 12px;width:100%}
input::placeholder,textarea::placeholder{color:#9c8a74}
textarea{resize:vertical;min-height:70px}
#place{position:fixed;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));padding:12px 16px;min-width:230px}
.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--a1);font-weight:700}
#place h1{font-size:22px;margin:2px 0}
#status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--a1);box-shadow:0 0 8px var(--a1)}
#shotbar{display:flex;gap:2px;padding:5px}
#shotbar button{background:none;border:0;color:var(--cream);padding:8px 13px;border-radius:10px;font-family:var(--display);font-size:15px;cursor:pointer;white-space:nowrap}
#shotbar button:hover{background:rgba(255,226,190,.1)}
#count{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:140px;color:#fff;text-shadow:0 6px 30px #000a;pointer-events:none;z-index:6}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .5s;z-index:7}
.photo{display:block;max-width:100%;border-radius:10px;box-shadow:0 8px 30px #0008}
#topright{position:fixed;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));display:flex;flex-direction:column;align-items:flex-end;gap:10px;max-width:min(360px,calc(100% - 270px))}
#notice{padding:12px 16px;min-width:200px}#notice p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
#hint{margin:0;font-size:13px;color:var(--cream);opacity:.8;text-align:right;text-shadow:0 1px 4px #000}
#actions{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:2px;padding:6px;max-width:calc(100% - 28px);overflow-x:auto}
#actions button{background:none;border:0;color:var(--cream);padding:9px 14px;border-radius:11px;font-family:var(--display);font-size:15px;cursor:pointer;white-space:nowrap;position:relative}
#actions button:hover{background:rgba(255,226,190,.1)}
#actions .primary{background:linear-gradient(180deg,var(--a1),var(--a2));color:#2a1608}
.badge{background:var(--warn);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;margin-left:4px;font-family:var(--body)}
#chatbox{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:calc(max(14px,env(safe-area-inset-bottom)) + 66px);width:min(360px,calc(100% - 28px));display:flex;flex-direction:column;gap:6px}
#chatlog{max-height:28vh;overflow:auto;display:flex;flex-direction:column;gap:2px;font-size:14px;text-shadow:0 1px 3px #000,0 0 8px #000a;-webkit-mask-image:linear-gradient(transparent,#000 35%);mask-image:linear-gradient(transparent,#000 35%)}
#chatlog p{margin:0;overflow-wrap:anywhere}#chatlog b{font-family:var(--display);font-weight:400;color:var(--a1);margin-right:6px}
#chatlog .butler b{color:var(--ok)}
#chatform{display:flex;gap:6px;padding:6px;border-radius:14px}
#chatform input{flex:1;min-width:0;border:0;background:transparent}
/* 입장 화면: 큰 명조 제목이 등불처럼 빛나는 로비 */
#gate{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at 50% 40%,rgba(40,26,14,.35),rgba(10,7,4,.82) 75%);z-index:5;overflow:auto}
#gate form{width:min(420px,100%);display:grid;gap:12px;text-align:center}
#gate .title{font-family:'Gowun Batang',serif;font-weight:700;font-size:clamp(46px,11vw,84px);line-height:1.1;margin:0;color:#f8e9c8;text-shadow:0 0 18px rgba(255,190,110,.55),0 0 50px rgba(255,160,70,.35)}
#gate .sub{margin:0 0 6px;color:#e3d2b6;font-family:'Gowun Batang',serif;font-size:16px}
#gate .live{font-size:13px;color:var(--a1);display:flex;justify-content:center;align-items:center;gap:6px;margin-bottom:6px}
#gate label.f{text-align:left}
#gate input{background:rgba(20,14,9,.75);border-color:rgba(230,190,120,.25);padding:12px 14px}
#gate .btn{background:linear-gradient(180deg,#e6c483,#c79b52);color:#2a1a08;padding:13px;font-size:17px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.err{color:var(--warn);margin:0;min-height:1.2em;font-size:14px}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--glass2);color:var(--cream);padding:22px;width:min(660px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;box-shadow:0 20px 60px #000a}
#lookPanel{position:fixed;z-index:4;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));width:min(400px,calc(100% - 28px));overflow:auto;padding:18px 20px}
#lookPanel h2{font-size:21px}#lookPanel h3{font-size:15px;margin:16px 0 8px;color:var(--a1)}
.lookHead{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-18px;background:var(--glass2);margin:-18px -20px 8px;padding:14px 20px;z-index:1}
@media(max-width:719px){#lookPanel{top:auto;left:10px;right:10px;width:auto;height:55vh;bottom:10px}}
dialog::backdrop{background:rgba(12,8,5,.55)}
dialog h2{font-size:23px;margin-bottom:12px;padding-right:30px}dialog h3{font-size:16px;margin:18px 0 8px;color:var(--a1)}
.dlgx{position:absolute;right:14px;top:12px;background:none;border:0;font-size:24px;cursor:pointer;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:rgba(255,236,210,.06);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.card b{font-family:var(--display);font-weight:400;color:var(--a1)}.card time{color:var(--muted);font-size:12px;margin-left:6px}
.card p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.card img{display:block;max-width:100%;border-radius:8px;margin-top:8px;background:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.empty{color:var(--muted);text-align:center;padding:18px}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.menu button{background:rgba(255,236,210,.06);border:1px solid var(--line);border-radius:14px;padding:14px 10px;cursor:pointer;text-align:left;display:grid;gap:2px}
.menu .drink{background:rgba(255,236,210,.06);border:1px solid var(--line);border-radius:14px;padding:12px 10px;display:grid;gap:4px}
.menu .drink .seg .btn{display:inline-block;padding:5px 14px;font-size:14px;border:0;background:linear-gradient(180deg,var(--a1),var(--a2));color:#2a1608}
.menu .drink .seg .btn.ghost{border:1px solid var(--line);background:rgba(160,205,235,.14);color:var(--cream)}
.menu button:hover{border-color:var(--a1)}.menu b{font-family:var(--display);font-weight:400;font-size:17px}.menu small{color:var(--muted)}
.paint{width:100%;border-radius:10px;touch-action:none;cursor:crosshair;display:block;background:#fff}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid #0004;cursor:pointer;padding:0}
.sw[aria-pressed=true]{outline:3px solid var(--a1);outline-offset:1px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;align-items:end}
.members{list-style:none;margin:0;padding:0}
.members li{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
@media(max-width:640px){#hint{display:none}#topright{top:auto;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 66px);right:14px;max-width:calc(100% - 28px)}#notice{min-width:0}#place{min-width:0;padding:10px 12px}#place h1{font-size:18px}#chatlog{max-height:20vh}}
</style>
</head>
<body>
<canvas id="c" tabindex="-1" aria-label="숲속 오피스 3D 방"></canvas>
<div id="hud" hidden>
  <section id="place" class="glass" aria-live="polite">
    <div class="eyebrow">FOREST OFFICE</div>
    <h1 id="placeName">숲속 공유 오피스</h1>
    <div id="status"></div>
  </section>
  <div id="topright">
    <div id="shotbar" class="glass"><button type="button" id="selfieBtn">셀카 찍기</button><button type="button" id="shotBtn">화면 찍기</button></div>
    <section id="notice" class="glass" hidden aria-live="polite"><div class="eyebrow">공지</div><p id="noticeText"></p></section>
    <p id="hint">바닥을 누르면 걸어가요 · 의자·소파에 앉고 긴 소파에 누워요<br>책장 → 책 읽기 · 화이트보드 → 낙서 · 벽난로 → 불 켜고 끄기 · 턴테이블 → 음악 · 집사 → 주문</p>
  </div>
  <section id="chatbox">
    <div id="chatlog" aria-live="polite"></div>
    <form id="chatform" class="glass"><input id="chat-in" maxlength="200" autocomplete="off" placeholder="채팅하기 (Enter)" aria-label="채팅 메시지"><button class="btn small">보내기</button></form>
  </section>
  <nav id="actions" class="glass" aria-label="메뉴">
    <button class="primary" id="cafeBtn">커피 주문</button>
    <button id="lookBtn">꾸미기</button>
    <button id="boardBtn">게시판</button>
    <button id="notesBtn">쪽지</button>
    <button id="soundBtn" aria-pressed="false">소리 켜기</button>
    <button id="adminBtn" hidden>관리자</button>
    <button id="logoutBtn">나가기</button>
  </nav>
</div>
<div id="count" aria-live="assertive" hidden></div><div id="flash"></div>
<div id="gate"></div>
<aside id="lookPanel" class="glass" hidden aria-label="캐릭터 꾸미기"></aside>
<dialog id="dlg"></dialog>
<audio id="a-bgm" loop></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s), PI=Math.PI;
function h(tag,props={},...kids){const e=document.createElement(tag);for(const k in props){const v=props[k];if(v==null)continue;if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k in e)e[k]=v;else e.setAttribute(k,v)}e.append(...kids.flat().filter(k=>k!=null));return e}

/* ================= 관리자 로그인: 영화관·미술관과 같은 Supabase 계정(선생님 이메일·비밀번호) ================= */
const SUPABASE_URL='https://kgjbxhxknxgbmsihvshe.supabase.co'; // 영화관·미술관 common.js 와 같은 프로젝트
const SUPABASE_KEY='sb_publishable_1K_wet7KC7fq7aPn6vB5dQ_nldPYACn'; // 공개용 키(Publishable). Secret key는 절대 넣지 마세요.
const sb=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;

/* ================= 온라인 저장소 (Supabase) ================= */
// 계정·채팅·게시판·쪽지·꾸민 모습·방 설정은 모두 Supabase에 저장돼요 (setup.sql 의 office_ 함수로만 드나들어요)
const KEY='forestOffice3d.v1';
const blank=()=>({users:[],chat:[],board:[],notes:[],set:{weather:'clear',time:'auto',vol:.5,notice:'',frameImg:'',track:''},wb:''});
let S=blank(),me=null,TOKEN=null;
try{TOKEN=localStorage.getItem(KEY+'.token')}catch{}
try{const v=localStorage.getItem(KEY+'.vol');if(v!=null)S.set.vol=+v}catch{}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const user=id=>S.users.find(u=>u.id===id);
const nameOf=id=>id==='butler'?'집사':user(id)?.name||'(없는 멤버)';
const fmt=t=>new Date(t).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'});
function setToken(t){TOKEN=t;try{t?localStorage.setItem(KEY+'.token',t):localStorage.removeItem(KEY+'.token')}catch{}}
// 서버 함수 부르기 (친구는 로그인 표를, 관리자는 이메일 로그인을 함께 보내요)
const friendly=m=>/Could not find the function|schema cache/i.test(m||'')?'아직 Supabase 설정(setup.sql)을 실행하지 않았어요.':/Failed to fetch|NetworkError/i.test(m||'')?'인터넷 연결을 확인해 주세요.':m;
async function rpc(fn,args={}){if(!sb)throw new Error('인터넷 연결이 필요해요.');const{data,error}=await sb.rpc(fn,{p_token:TOKEN,...args});if(error)throw new Error(friendly(error.message));return data}
function applyData(d){me=d.me;
  S.users=(d.members||[]).map(m=>({id:m.id,name:m.name,admin:m.admin,email:m.email,look:m.look&&Object.keys(m.look).length?m.look:undefined}));
  S.chat=d.chat||[];S.board=d.board||[];S.notes=d.notes||[];
  const st=d.state||{};Object.assign(S.set,{weather:st.weather||'clear',time:st.time||'auto',notice:st.notice||'',frameImg:st.frameImg||'',fire:st.fire,track:st.track||''});S.wb=st.wb||''}
let refreshing=null;
// 서버에서 다시 불러와 화면을 새로 그려요 (내가 바꿨을 때, 다른 사람이 바꿨다는 알림이 왔을 때, 30초마다)
function refresh(){if(!me)return Promise.resolve();if(refreshing)return refreshing;
  refreshing=(async()=>{const before=unread().length;
    try{applyData(await rpc('office_bootstrap'))}catch(e){return}
    if(!user(me))return leave();renderAll();loadAudio();if(unread().length>before)noteAlert()})().finally(()=>{refreshing=null});return refreshing}
function changed(){net.send({t:'refresh',id:me})} // 다른 사람들에게 "새로 불러와요"
// 바꾸기: 서버에 쓰고 → 다시 불러오고 → 다른 사람들에게 알려요. 실패하면 이유를 돌려줘요(성공하면 null)
async function act(fn,args){try{await rpc(fn,args);await refresh();changed();return null}catch(e){const msg=e.message||'저장하지 못했어요.';toast(msg);return msg}}
let profT=null;
function saveProfile(){clearTimeout(profT);profT=setTimeout(()=>{const u=user(me);if(u)act('office_profile',{p_name:u.name,p_look:u.look||{}})},400)}
function setState(key,value){S.set[key]=value;return act('office_state_set',{p_key:key,p_value:value})}
const isDay=hr=>hr>=8&&hr<17;
const HAIRS=[['short','짧은 머리'],['bob','단발'],['twin','양갈래'],['long','긴 머리'],['bun','올림 머리']];
const HAIRC=[0x5a3424,0x8a4a2a,0x2a2220,0xd9a441,0xc8642c];
const SKINS=[0xffd9c2,0xf6c3a0,0xe0a67e,0xb57a52];
const TOPS=[0xf4ecdc,0x7aa3c9,0xd9826b,0x8fae7a,0xb59ad6,0xf2c46d];
const BOTS=[0x6b3a2e,0x3e4a6b,0x8a8f99,0x4d6b4a,0xc9b8a0];
const BOTTOMS=[['shorts','반바지'],['skirt','치마'],['pants','긴바지']];
const BANGS=[['full','일자 앞머리'],['part','5:5 앞머리']];
const OUTFITS=[['tee','반팔티'],['hoodie','후드티'],['pajama','파자마'],['dress','공주풍 드레스'],['rags','거지옷'],['webtoon','웹툰작가'],['custom','옷 그리기']];
// 웹툰작가를 고르면 함께 바뀌는 것: 똥머리 + 동그란 안경 + 흰 긴팔 + 땡땡이 수면바지
const WEBTOON={outfit:'webtoon',hair:'bun',glasses:'round',botCol:'#f2b3c2'};
const HATS=[['none','없음'],['cap','캡모자']];
const GLASSES=[['none','없음'],['round','동그란 안경'],['square','검정 뿔테 선글라스']];
const EYES=[['dot','작은 점'],['big','큰 점'],['oval','세로 타원'],['shine','반짝 큰 눈'],['round','동그란 눈'],['happy','^ 웃는 눈'],['closed','∪ 감은 눈']];
const NOSES=[['none','없음'],['dot','점'],['tri','삼각 ▽'],['round','동그란 코']];
const MOUTHS=[['u','U 미소'],['tri','▽ 작은 삼각'],['w','ω 입'],['flat','일자'],['frown','∩ 시무룩'],['open','입 벌림']];
const hexOf=c=>'#'+c.toString(16).padStart(6,'0');
const defaultLook=i=>({hair:HAIRS[i%5][0],hc:i%5,skin:i%2,bottom:i%2?'skirt':'shorts',topCol:hexOf(TOPS[i%6]),botCol:hexOf(BOTS[i%5]),
  bang:'full',outfit:'tee',hat:'none',capCol:'#3e6b8a',glasses:'none',eye:'dot',nose:'none',mouth:'u'});
function lookOf(u){const l=Object.assign(defaultLook(Math.max(0,S.users.indexOf(u))),u&&u.look),o=(u&&u.look)||{};
  if(o.top!=null&&!o.topCol)l.topCol=hexOf(TOPS[o.top]);if(o.bc!=null&&!o.botCol)l.botCol=hexOf(BOTS[o.bc]);return l} // 예전 저장값(색 번호)도 이어서 써요
// drink: 음료 색 (핫/아이스를 골라요)

function tap(cx,cy){if(!myAv)return;ray.setFromCamera({x:cx/innerWidth*2-1,y:-(cy/innerHeight)*2+1},camera);
  for(const hit of ray.intersectObjects(clickables,true)){let o=hit.object;while(o&&!o.userData.act)o=o.parent;if(!o)continue;const a=o.userData.act;
    if(a==='floor')return walkTo(hit.point.x,hit.point.z);if(a==='butler')return openCafe();if(a.pet!=null)return petTap(pets.find(x=>x.root===o));if(a==='shelf')return fetchBook(o);if(a==='wb')return openWhiteboard();if(a==='fire')return toggleFire();if(a==='turntable')return openTurntable();if(a==='blanket')return useBlanket();if(a==='rug')return lieOnRug(hit.point);if(a.seat!=null)return sitAt(a.seat)}}
// 동물을 누르면: 간식을 들고 있으면 다가가서 주고(동물이 폴짝폴짝), 아니면 울음소리 말풍선

  const pp=p.root.position;p.target=null;p.mode='walk';p.resting=false;p.wait=8;pp.y=0; // 받을 때까지 기다려요
  const me0=myAv.root.position,dx=me0.x-pp.x,dz=me0.z-pp.z,d=Math.hypot(dx,dz)||1;myAv.seat=null;
  myAv.target={x:clampX(pp.x+dx/d*.75),z:clampZ(pp.z+dz/d*.75),done(){const m=myAv.root.position;myAv.root.rotation.y=Math.atan2(pp.x-m.x,pp.z-m.z);p.root.rotation.y=Math.atan2(m.x-pp.x,m.z-pp.z);
    setItem(myAv,'');announce();p.hopT=1.6;bubble(p,p.cat?'냠냠… 골골골 ♥':'냠냠! 왈왈 ♥',3)}};announce()}

const clampX=x=>Math.max(-9.2,Math.min(9.3,x)),clampZ=z=>Math.max(-7.1,Math.min(7.6,z));

/* ================= 함께 접속: Supabase 실시간 채널 ================= */
// 위치·자세(presence)는 바뀔 때만 보내고, 말풍선·"새로 불러와요"는 한 번씩 알려요 (무료 사용량 아끼기)
let ch=null,trackTimer=null,pendingSt=null,lastSent='';
const net={
  send(m){if(!ch)return;
    if(m.t==='st'){const js=JSON.stringify(m.st);if(js===lastSent)return;pendingSt=m.st;
      if(!trackTimer)trackTimer=setTimeout(()=>{trackTimer=null;if(!ch)return;lastSent=JSON.stringify(pendingSt);ch.track(pendingSt)},300);return}
    ch.send({type:'broadcast',event:'ev',payload:m})},
  join(){if(ch||!sb)return;lastSent='';
    ch=sb.channel('forest-office',{config:{presence:{key:me},broadcast:{self:false}}});
    ch.on('presence',{event:'sync'},()=>{const ps=ch.presenceState(),here=new Set();
      for(const[id,arr]of Object.entries(ps)){if(id===me||!arr.length)continue;here.add(id);onNet({t:'st',id,st:arr[arr.length-1]})}
      for(const id of[...peers.keys()])if(!here.has(id))onNet({t:'bye',id})});
    ch.on('broadcast',{event:'ev'},({payload})=>onNet(payload));
    ch.subscribe(st=>{if(st==='SUBSCRIBED'){lastSent='';announce()}})},
  leave(){if(ch){sb.removeChannel(ch);ch=null}clearTimeout(trackTimer);trackTimer=null}};
// 누가 이미 앉아 있으면: 그 사람 뒤 바닥에 쪼그려 앉아 구경해요
function squatBehind(i){const s=SEATS[i],x=clampX(s.x-Math.sin(s.ry)*.8),z=clampZ(s.z-Math.cos(s.ry)*.8);myAv.seat=null;
  myAv.target={x,z,done(){myAv.root.rotation.y=s.ry;myAv.squat=true;bubble(myAv,'옆에서 구경할게요',2.5);announce()}};announce()}
function myState(){const p=myAv.root.position;return{x:+p.x.toFixed(2),z:+p.z.toFixed(2),ry:+myAv.root.rotation.y.toFixed(2),seat:myAv.seat,item:myAv.item,squat:!!myAv.squat,blanket:!!myAv.blanket,tx:myAv.target?.x,tz:myAv.target?.z}}
function announce(){if(myAv)net.send({t:'st',id:me,st:myState()})}
let unknownT=0;
function onNet(m){
  if(!me||!m||m.id===me)return;
  if(m.t==='refresh')return refresh();
  if(m.t==='bye'){const p=peers.get(m.id);if(p){scene.remove(p.av.root);peers.delete(m.id)}return renderStatus()}
  if(m.t==='say'){const p=peers.get(m.id);p&&bubble(p.av,m.text);return}
  if(m.t==='st'){let p=peers.get(m.id);const u=user(m.id);if(!u){if(Date.now()-unknownT>5000){unknownT=Date.now();refresh()}return} // 새로 만든 친구면 멤버 목록부터 새로
    const lk=JSON.stringify(lookOf(u));
    if(!p||p.lk!==lk){const av=makeAvatar(u.name,lookOf(u));if(p){av.root.position.copy(p.av.root.position);scene.remove(p.av.root)}else av.root.position.set(m.st.x,0,m.st.z);
      p={...p,av,lk};peers.set(m.id,p);renderStatus()} // 친구가 꾸미기를 바꾸면 다시 만들어요
    p.st=m.st;p.seen=Date.now();const a=p.av;setItem(a,m.st.item);
    if(!!m.st.blanket!==!!a.blanket){a.blanket=!!m.st.blanket;setBlanket(a,a.blanket)}
    a.squat=!!m.st.squat;if(a.squat&&m.st.tx==null){a.target=null;a.root.position.set(m.st.x,0,m.st.z);a.root.rotation.y=m.st.ry}
    if(m.st.seat!=null){const s=SEATS[m.st.seat];a.target=null;a.seat=m.st.seat;a.root.position.set(s.x,0,s.z);a.root.rotation.y=s.ry}
    else{a.seat=null;const tx=m.st.tx??m.st.x,tz=m.st.tz??m.st.z;if(Math.hypot(a.root.position.x-m.st.x,a.root.position.z-m.st.z)>3)a.root.position.set(m.st.x,0,m.st.z);a.target={x:tx,z:tz}}}}

/* ---------- 책은 20초쯤 읽으면 덮고, 꺼냈던 책장에 다시 꽂아요 ---------- */
const READ_SECS=20;
function readTick(dt){const a=myAv;if(!a||a.item!=='book'||a.seat==null||a.target)return;
  if((a.readT=(a.readT||0)+dt)<READ_SECS)return;a.readT=0;
  const back=a.bookFrom||{x:-8.95,z:-3.35};setItem(a,'bookc');bubble(a,'다 읽었다! 제자리에 둘게요',2.5);a.seat=null;
  a.target={x:back.x,z:back.z,done(){a.root.rotation.y=-PI/2;setItem(a,'');bubble(a,'책장에 쏙',2);announce()}};announce()}
/* ---------- 타자 소리 (파일 없이 만든 짧은 딸깍 소리) ---------- */
let actx=null,keyT=0;
function ac(){if(!actx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;actx=new A()}if(actx.state==='suspended')actx.resume();return actx}
function keyClick(){const a=ac();if(!a)return;const len=.03,buf=a.createBuffer(1,a.sampleRate*len|0,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,4);
  const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=buf;f.type='bandpass';f.frequency.value=1800+Math.random()*1600;g.gain.value=(.1+Math.random()*.08)*(.4+S.set.vol);
  s.connect(f).connect(g).connect(a.destination);s.start()}
function typingSound(dt){if(!myAv||myAv.seat==null||myAv.target||SEATS[myAv.seat].act!=='type'||myAv.itemOn==='hand'&&myAv.item)return;
  if((keyT-=dt)>0)return;keyClick();keyT=Math.random()<.08?.4+Math.random()*.7:.06+Math.random()*.11}
/* ---------- 액정타블렛: 앉아 있는 동안 검은 펜 선이 계속 그려져요 ---------- */
const TAB={x:256,y:150,a:0,n:0};
function drawTablet(){const busy=(myAv&&myAv.seat===0&&!myAv.target)||[...peers.values()].some(p=>p.st.seat===0);if(!busy)return;
  const g=tabTex.image.getContext('2d');
  if(TAB.n++>1100){g.fillStyle='#fbf7ef';g.fillRect(0,0,512,300);TAB.n=0;TAB.x=256;TAB.y=150} // 다 그리면 새 장
  if(Math.random()<.012){TAB.x=60+Math.random()*390;TAB.y=40+Math.random()*220;TAB.a=Math.random()*7;return} // 펜을 떼고 다른 곳에서 새 선
  g.strokeStyle='#1b1a22';g.lineWidth=3;g.lineCap='round';g.beginPath();g.moveTo(TAB.x,TAB.y);
  TAB.a+=(Math.random()-.5)*.8;TAB.x+=Math.cos(TAB.a)*3;TAB.y+=Math.sin(TAB.a)*3;
  if(TAB.x<30||TAB.x>482||TAB.y<20||TAB.y>280){TAB.a+=PI;TAB.x=Math.max(30,Math.min(482,TAB.x));TAB.y=Math.max(20,Math.min(280,TAB.y))}
  g.lineTo(TAB.x,TAB.y);g.stroke();tabTex.needsUpdate=true}
const clock=new THREE.Clock();
(function loop(){const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  if(myAv)animate(myAv,dt);for(const p of peers.values())animate(p.av,dt);animateButler(dt,t);pets.forEach(p=>updatePet(p,dt,t));updateWeather(dt);typingSound(dt);drawTablet();turntableTick(dt);twinkle(t);SHELF_BLANKET.visible=!(myAv&&myAv.blanket)&&!blanketTaken();readTick(dt);
  if(window.FLAMES){FLAMES.forEach((f,i)=>{if(i)f.scale.y=1+Math.sin(t*12+i*2)*.15+Math.random()*.08});fireLight.intensity=S.set.fire===false?0:(NIGHT?1.6:.6)*(.85+Math.random()*.3)}
  updateCamera(dt);renderer.render(scene,camera);requestAnimationFrame(loop)})();
